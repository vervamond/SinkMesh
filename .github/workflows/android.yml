name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare fixed debug keystore
      if: env.DEBUG_KEYSTORE_BASE64 != ''
      run: |
        set -eo pipefail
        echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
        test -s "$RUNNER_TEMP/debug.keystore"
        chmod 600 "$RUNNER_TEMP/debug.keystore"
        echo "SIGNING_STORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
        echo "SIGNING_STORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
        echo "SIGNING_KEY_ALIAS=$DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
        echo "SIGNING_KEY_PASSWORD=$DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"

    - name: Build APKs (assembleDebug + assembleRelease)
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
